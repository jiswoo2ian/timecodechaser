<style>
/* One visual world on purpose: a light, community-board mobile web page inside a phone.
   Layout: phone on a desk for wide screens; the page itself, edge to edge, on a real phone. */
:root{
  color-scheme:light;
  --desk:#e6e8ef; --desk-ink:#6d7282;
  --bezel:#111216; --bezel-edge:#2a2c33;
  --bg:#ffffff; --fg:#111111; --sub:#555a66; --muted:#8a8f9c; --faint:#b3b7c2;
  --line:#e4e6ee; --line2:#d6d9e4; --soft:#f6f7fb; --countcol:#f3f4fa; --reply:#f7f8fb;
  --navy:#3b4890; --navy2:#4352a3; --navy-deep:#2f3a7a; --yellow:#ffe94a;
  --red:#d31900; --orange:#f26a1b; --notice:#e65a2b; --blue:#3b4890; --link:#2a5bd7;
  --toast:#222; --toast-ink:#fff; --shadow:rgba(20,24,40,.28);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--desk);color:var(--fg);font-family:var(--font)}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
form{margin:0}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}
mark{background:#fff0a0;color:inherit;border-radius:2px}

.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.device-wrap{position:relative;flex:none}
.device{position:absolute;left:0;top:0;width:417px;height:876px;transform-origin:top left;
  background:var(--bezel);border-radius:64px;padding:12px;box-shadow:0 0 0 2px var(--bezel-edge),0 30px 70px var(--shadow)}
.screen{position:relative;width:100%;height:100%;border-radius:52px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.status{flex:none;height:54px;display:flex;align-items:center;justify-content:space-between;padding:12px 30px 0 44px;font-weight:600;font-size:16px;background:var(--bg);position:relative;z-index:3;color:#000}
.status .icons{display:flex;gap:6px;align-items:center}
.status svg{display:block}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:4}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:#111;z-index:9;pointer-events:none}
.caption{font-size:12px;color:var(--desk-ink);text-align:center;max-width:417px}

/* in-app browser chrome */
.urlbar{flex:none;height:34px;display:flex;align-items:center;justify-content:center;position:relative;font-size:14px;color:#666;background:var(--bg);border-bottom:1px solid #eee}
.urlbar button{position:absolute;right:14px;top:5px;width:24px;height:24px;display:grid;place-items:center;color:#333}
.btool{flex:none;height:66px;padding-bottom:16px;display:flex;justify-content:space-around;align-items:center;background:var(--bg);border-top:1px solid #e9e9ee;position:relative;z-index:5}
.btool button{width:44px;height:40px;display:grid;place-items:center;color:#222}
.btool button[disabled]{color:#c4c7cf}

.ptr{position:absolute;left:50%;top:88px;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);display:grid;place-items:center;color:var(--navy);z-index:7;opacity:0;transform:translateY(-30px);pointer-events:none}
.ptr.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.full .ptr{position:fixed;top:calc(8px + env(safe-area-inset-top,0px))}
.app{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;background:var(--bg)}
.app::-webkit-scrollbar{display:none}

body.full .stage{padding:0;gap:0;justify-content:flex-start;height:100%}
body.full .device-wrap{width:100%!important;height:100%!important}
body.full .device{position:static;width:100%;height:100%;transform:none!important;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
body.full .screen{border-radius:0}
body.full .app,body.full .dock{zoom:.95}
body.full .status,body.full .island,body.full .homebar,body.full .caption,body.full .urlbar,body.full .btool{display:none}

/* site header */
.site{background:var(--navy);padding:7px 8px 7px 4px;display:flex;align-items:center;gap:6px}
.logo{flex:none;width:42px;height:34px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:21px;letter-spacing:-1.5px;font-style:italic}
.sbox{flex:1;min-width:0;display:flex;align-items:center;background:#fff;border:2px solid var(--navy-deep);height:34px}
.sbox .ham{flex:none;width:34px;height:100%;display:grid;place-items:center;border-right:1px solid #e3e3e8;color:#888}
.sbox input{flex:1;min-width:0;border:0;outline:0;padding:0 8px;font-size:13.5px;background:transparent;color:#222}
.sbox input::placeholder{color:#aaa}
.sbox .go{flex:none;width:36px;height:100%;display:grid;place-items:center;color:var(--navy)}
.sbox .recent{flex:none;padding:0 10px;border-left:1px solid #e3e3e8;font-size:12.5px;font-weight:700;color:#333;height:60%;display:flex;align-items:center}
.gnav{background:var(--navy2);display:flex;gap:22px;overflow-x:auto;padding:0 12px;height:38px;align-items:center;scrollbar-width:none}
.gnav::-webkit-scrollbar{display:none}
.gnav button{color:#fff;font-weight:700;font-size:15px;white-space:nowrap}
.gnav button.on{color:var(--yellow)}

.gtitle{display:flex;align-items:center;gap:5px;padding:10px 10px 9px 12px;border-bottom:1px solid var(--line)}
.gtitle .nm{font-size:18px;font-weight:900;letter-spacing:-.04em;white-space:nowrap}
.gtitle .m{flex:none;width:21px;height:21px;border:2px solid #111;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;line-height:1}
.gtitle .cnt{font-size:12px;color:var(--muted)}
.gtitle .sp{flex:1}
.gtitle .ln{display:flex;align-items:center;gap:5px;font-size:12.5px;color:#333;white-space:nowrap}
.gtitle .ln i{font-style:normal;color:#ddd}
.gtitle .ln .info{width:17px;height:17px;border:1.3px solid #999;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#999;font-weight:700}
.gtitle .ln .n{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#e1251b;color:#fff;font-size:9px;font-weight:700;margin-left:1px;vertical-align:2px}
.wbtn{flex:none;border:1.5px solid var(--navy);color:var(--navy);padding:4px 8px;font-size:13px;font-weight:700;white-space:nowrap}
.adline{padding:8px 12px 9px;border-bottom:1px solid var(--line)}
.adline b{font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center}
.adtag{font-size:11px;color:#999;border:1px solid #d5d5dc;border-radius:10px;padding:0 6px;font-weight:500}
.adline p{margin:3px 0 0;font-size:11.5px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:3}
.tabs button.t{flex:1;padding:9px 0 7px;font-size:14.5px;font-weight:700;color:#111;border-bottom:3px solid transparent;position:relative}
.tabs button.t+button.t::before{content:"";position:absolute;left:0;top:16px;bottom:14px;width:1px;background:#e3e3e8}
.tabs button.t[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
.tabs .per{flex:.9;font-size:13px;color:#444;display:flex;align-items:center;justify-content:center;gap:4px}
.heads{display:flex;gap:14px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);scrollbar-width:none;background:var(--bg)}
.heads::-webkit-scrollbar{display:none}
.heads button{font-size:13.5px;color:#333;white-space:nowrap;display:flex;align-items:center;gap:2px}
.heads button[aria-pressed="true"]{color:#111;font-weight:900}
.ic{font-size:15px;line-height:1}

.lsearch{display:flex;gap:6px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--soft)}
.lsearch select{flex:none;border:1px solid var(--line2);background:#fff;padding:5px 4px;font-size:12.5px;color:#333}
.lsearch input{flex:1;min-width:0;border:1px solid var(--line2);background:#fff;padding:5px 8px;font-size:14px}
.lsearch button{flex:none;background:var(--navy);color:#fff;padding:0 12px;font-size:13px;font-weight:700}
.sres{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;font-size:13.5px;border-bottom:1px solid var(--line)}
.sres b{color:var(--navy)}
.sres button{color:var(--muted);font-size:12.5px;text-decoration:underline}
.empty{padding:50px 16px;text-align:center;color:var(--muted);font-size:14px}

/* list rows */
.lrow{display:flex;width:100%;text-align:left;border-bottom:1px solid var(--line);background:var(--bg)}
.lrow:active{background:var(--soft)}
.lrow .main{flex:1;min-width:0;padding:9px 6px 8px 12px}
.lrow .cc{flex:none;width:42px;background:var(--countcol);color:var(--red);display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.lrow .tl{display:flex;align-items:flex-start;gap:5px;font-size:14.5px;line-height:1.38}
.lrow .tl .tt{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.lrow .meta{margin-top:4px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.lrow .meta i{font-style:normal;color:#e0e0e6}
.lrow .meta .hd{display:flex;align-items:center;gap:2px;color:#555}
.bub{flex:none;width:17px;height:17px;margin-top:1px}
.pill{flex:none;font-size:13px;border:1.5px solid;border-radius:14px;padding:1px 9px;font-weight:700;margin-top:-1px}
.pill.survey{border-color:var(--orange);color:var(--orange)}
.pill.ad{border-color:#222;color:#222;font-weight:500}
.pill.notice{border-color:var(--notice);color:var(--notice)}
.pill.best{border-color:var(--blue);color:var(--blue)}
.srow .main{display:flex;align-items:center;gap:7px;padding:9px 6px 9px 12px}
.srow .tt1{min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .tt1.survey{color:var(--orange);font-weight:700}
.pager{display:flex;justify-content:center;gap:4px;padding:18px 16px 6px}
.pager button{min-width:32px;height:32px;font-size:14px;color:#666}
.pager button[aria-current="page"]{color:var(--navy);font-weight:900;text-decoration:underline}
.foot{padding:14px 16px 24px;text-align:center;font-size:12px;color:var(--faint)}

.dock{position:absolute;left:0;right:0;bottom:66px;z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:flex-end}
.dock>*{pointer-events:auto}
body.full .dock{position:fixed;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:transparent}
.spacer{height:var(--dockh,70px)}
.fab{margin:0 16px 12px 0;width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px var(--shadow);z-index:5}
.ccpill{margin:0 14px 12px 0;height:46px;padding:0 18px;border-radius:24px;background:#fff;border:1.5px solid #e2e4ec;box-shadow:0 4px 12px rgba(0,0,0,.12);display:flex;align-items:center;gap:8px;color:#333;font-size:16px;z-index:5}
.ccpill svg{color:var(--navy)}
.adbar{position:relative;align-self:stretch;background:#fff;border-top:1px solid var(--line);padding:9px 40px 10px 14px}
.adbar b{font-size:15px;display:flex;gap:6px;align-items:center}
.adbar p{margin:3px 0 0;font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adbar .x{position:absolute;right:8px;top:8px;width:24px;height:24px;border:1px solid #999;display:grid;place-items:center;color:#666;background:#f3f3f3}

/* post view */
.backbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px 6px 6px}
.backbar .bk{display:flex;align-items:center;gap:2px;font-size:15px;font-weight:700;color:#222;padding:6px 8px}
.backbar .ls{font-size:14px;color:var(--navy);font-weight:700;border:1.5px solid var(--navy);padding:4px 12px}
.pbody .gh{font-size:17px;font-weight:900;margin:18px 0 4px;line-height:1.4}
.pbody .gh.red{font-size:19px;color:var(--red)}
.nick{display:inline-flex;align-items:center;gap:3px}
.badge{width:15px;height:15px;flex:none}
.ginfo{display:flex;gap:12px;padding:8px 14px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap;overflow:hidden}
.ginfo .nick{color:#222;font-weight:700}
.photos{display:grid;gap:14px;padding:0 14px 26px}
.photos figure{margin:0}
.photos .art{border:1px solid var(--line);line-height:0;background:#eee}
.photos .art svg{width:100%;height:auto;display:block}
.photos .art.vintage{position:relative;overflow:hidden}
.photos .art.vintage svg{filter:sepia(.32) saturate(.8) contrast(.92) brightness(1.06) hue-rotate(-6deg)}
.photos .art.vintage::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(255,240,215,.16) 0%,rgba(255,240,215,0) 45%,rgba(30,20,10,.38) 100%);mix-blend-mode:multiply;pointer-events:none}
.photos .art.vintage::before{content:"";position:absolute;inset:0;background:rgba(255,200,140,.10);z-index:1;pointer-events:none}
.photos figcaption{margin-top:6px;font-size:14px;color:#444}
.lrow.burst{cursor:default}
.lrow.burst.new{animation:drop .35s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.closed{min-height:70%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:70px 20px;text-align:center;background:#f4f5f8;border-top:1px solid var(--line)}
.closed .ex{width:64px;height:64px;border-radius:50%;border:4px solid #c3c6d1;color:#c3c6d1;font-size:38px;font-weight:900;display:grid;place-items:center}
.closed b{font-size:19px;color:#222}
.closed p{margin:0;font-size:14px;color:#888;line-height:1.6}
.closed button{margin-top:10px;border:1.5px solid var(--navy);color:var(--navy);background:#fff;padding:8px 22px;font-weight:700;font-size:14px}
.ptitle{padding:12px 12px 8px}
.ptitle h1{margin:0;font-size:17.5px;line-height:1.38;font-weight:900;letter-spacing:-.02em;overflow-wrap:anywhere}
.pwho{display:flex;align-items:center;gap:7px;padding:2px 12px 10px;border-bottom:1px solid var(--line);font-size:13px;color:#333}
.pwho i{font-style:normal;color:#ddd}
.pwho .dt{color:var(--muted);font-variant-numeric:tabular-nums}
.pwho .sp{flex:1}
.pwho .fold{width:26px;height:22px;background:#c8cad3;border-radius:3px;display:grid;place-items:center;color:#fff;font-weight:900}
.pstat{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:12.5px;color:#555;font-variant-numeric:tabular-nums}
.pstat i{font-style:normal;color:#ddd}
.pstat .r{color:var(--red)}
.pstat .cpill{border:1px solid #d9dbe5;background:#f3f4f8;border-radius:16px;padding:2px 12px}
.adcard{margin:4px 14px 18px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.adcard .img{height:150px;background:linear-gradient(120deg,#1d2350 0%,#4b2a6e 55%,#8a2f5d 100%);position:relative;color:#fff;padding:16px}
.adcard .img .k{font-size:12px;opacity:.8;letter-spacing:.04em}
.adcard .img .big{font-size:23px;font-weight:900;line-height:1.25;margin-top:8px}
.adcard .img .tag{position:absolute;right:10px;top:10px;font-size:11px;background:rgba(255,255,255,.25);border-radius:10px;padding:1px 7px}
.adcard .img .orb{position:absolute;right:22px;bottom:18px;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#d9d6f2 60%,#9d97cf);opacity:.9}
.adcard .txt{padding:12px 14px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.adcard .txt b{display:block;font-size:16px}
.adcard .txt span{font-size:13px;color:#555}
.adcard .txt button{flex:none;background:#b9846a;color:#fff;border-radius:20px;padding:8px 14px;font-weight:700;font-size:14px}
.pbody{padding:4px 12px 24px;font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.votes{display:flex;justify-content:center;gap:12px;padding:0 14px 24px;border-bottom:8px solid var(--soft)}
.vote{min-width:104px;border:1.5px solid var(--line2);border-radius:6px;padding:9px 12px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12.5px;color:#666;background:#fff}
.vote b{font-size:19px;color:var(--red);font-variant-numeric:tabular-nums}
.vote.down b{color:#666}
.vote[aria-pressed="true"]{border-color:var(--navy);background:#f1f2fa}
.chead{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:2px solid var(--navy);font-size:15px;font-weight:700}
.chead em{font-style:normal;color:var(--red)}
.chead .sort{display:flex;gap:10px;font-weight:500;font-size:13px}
.chead .sort button{color:var(--faint)}
.chead .sort button[aria-pressed="true"]{color:#111;font-weight:700}
.nocmt{padding:30px 16px;text-align:center;color:var(--faint);font-size:14px}

.cmt{padding:9px 12px 8px;border-bottom:1px solid var(--line);position:relative;background:#fff}
.cmt.r{background:var(--reply);padding-left:30px}
.cmt.r::before{content:"ㄴ";position:absolute;left:13px;top:9px;color:#aaa;font-size:12px}
.cmt.r2{padding-left:44px}
.cmt.r2::before{left:28px}
.cmt.r3{padding-left:58px}
.cmt.r3::before{left:42px}
.cmt.r4{padding-left:72px}
.cmt.r4::before{left:56px}
.chd{display:flex;align-items:center;gap:2px;font-size:13.5px}
.chd .ip{color:var(--muted);font-size:12.5px}
.chd .atag{margin-left:6px;font-size:11px;color:var(--navy);border:1px solid var(--navy);border-radius:9px;padding:0 6px;line-height:16px}
.cmt.mine{box-shadow:inset 3px 0 0 var(--navy)}
.ctx{margin-top:3px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.ctx a{color:var(--link);text-decoration:underline;word-break:break-all;cursor:pointer}
.cdt{margin-top:3px;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.cmt.del .ctx{color:var(--faint);margin:0;font-size:13px}
.cmt.live .ctx,.cmt.live .chd,.cmt.live .cdt{transition:opacity .35s}
.cmt.fading .ctx,.cmt.fading .chd,.cmt.fading .cdt{opacity:0}
.stk{margin-top:6px;width:110px;height:110px;display:grid;place-items:center}
.stk svg{width:100px;height:100px}
.stk.shake svg{animation:shake .18s linear infinite}

일단 발현은 본인 선택이 아님.
그건 다 알 거고.
문제는 발현 이후 선택지가 사실상 세 개밖에 없다는 거임.
1. 센터 편입
2. 반정부 합류
3. 은둔
근데 은둔은 추적 때문에 현실적으로 불가능하고(무조건 3일 안에 잡힌다는 얘기가 괜히 나오는 게 아님)

폭주 한 번이면 끝임.

결국 체제 안에서 목소리를 내야 함.
이런 얘기하면 센터견이라고 할 텐데 그냥 현실을 말하는 거임.
감정 빼고 팩트로 봐라.

const IPRX=/^\s*([\d.]*)\s*(?:;\s*(작성자))?\s*$|^\s*(작성자)\s*$/;
function setText(c,t){
  t=t.trim();let m;
  if((m=t.match(/^\[\[link:(\w+)\]\](.*)$/))){c.link=m[1];c.text=m[2].trim();return}
  if((m=t.match(/^\[\[kill:(\d+)\]\]([\s\S]*)$/))){c.killAfter=+m[1];t=m[2].trim()}
  if((m=t.match(/^\[\[late:(\d+)\]\]([\s\S]*)$/))){c.lateBy=+m[1];t=m[2].trim()}
  if(/디씨콘\)$/.test(t)&&t.startsWith('(')){c.sticker=/덜덜/.test(t)?'shake':'basic';c.text='';return}
  if(t.startsWith('[[burn]]')){c.burn=true;t=t.slice(8).trim()}
  if(t==='삭제된 댓글입니다.'||t==='작성자가 삭제한 댓글입니다.'){c.deleted=true;c.text='';return}
  c.text=t;
}
function mkC(paren,rest,level,p){
  const inner=paren.slice(1,-1);const m=inner.match(IPRX);
  const author=!!(m&&(m[2]||m[3]));const ip=m&&m[1]&&/\d+\.\d+/.test(m[1])?m[1]:null;
  if(author&&ip&&!p.ip)p.ip=ip;
  const c={level,ip,author,text:'',replies:[]};
  if(rest&&rest.trim())setText(c,rest);
  return c;
}
function mkReply(t,lvl,p){
  const m=t.match(/^(?:ㅇㅇ\s*)?(\([^)]*\))\s*([\s\S]*)$/);
  if(m&&IPRX.test(m[1].slice(1,-1)))return mkC(m[1],m[2],lvl,p);
  const c={level:lvl,ip:null,author:false,text:'',replies:[]};
  setText(c,t.replace(/^ㅇㅇ\s+/,''));
  return c;
}
function parseAll(raw){
  const posts=[];let p=null,mode=null,cur=null,last=null,orphan=false;
  for(const l0 of raw.split('\n')){
    const l=l0.trim();
    if(!l){if(mode==='body'&&p&&p.body)p.body+='\n';continue}
    let m;
    if(l.startsWith('>')){m=l.match(/(\d+)\s*초\s*(후|뒤)/);if(m&&p)p.autoDel=+m[1];continue}
    if((m=l.match(/^제목:\s*(.*)$/))){p={title:m[1].trim(),body:'',comments:[],ip:null};posts.push(p);mode='pre';cur=null;last=null;orphan=false;continue}
    if(!p)continue;
    if((m=l.match(/^작성자:\s*(?:ㅇㅇ)?\s*\(([\d.]+)\)/))){p.ip=m[1];continue}
    if((m=l.match(/^내용:\s*(.*)$/))){mode='body';p.body=m[1].trim();continue}
    if(/^댓글:/.test(l)){mode='cmt';continue}
    const isStart=/^ㅇㅇ\s*\(/.test(l)||/^[└ㄴ]/.test(l)||l.startsWith('삭제된 댓글입니다.');
    if(mode==='body'&&!isStart){p.body=p.body&&!p.body.endsWith('\n')?p.body+'\n'+l:(p.body||'')+l;continue}
    mode='cmt';
    if((m=l.match(/^ㅇㅇ\s*(\([^)]*\))\s*(.*)$/))){cur=mkC(m[1],m[2],0,p);p.comments.push(cur);last=cur;orphan=false;continue}
    if(l.startsWith('삭제된 댓글입니다.')&&!(cur&&!orphan&&!cur.text&&!cur.replies.length&&!cur.sticker&&!cur.deleted&&!cur.link)){const live=(l.match(/\{\{(.+)\}\}/)||[])[1];cur={level:0,deleted:!live,live:live||null,ip:null,text:live||'',replies:[]};p.comments.push(cur);last=cur;orphan=false;continue}
    if(cur&&!orphan&&!cur.text&&!cur.replies.length&&!cur.sticker&&!cur.deleted&&!cur.link){setText(cur,l);continue}
    if((m=l.match(/^((?:└\s*)+|ㄴㄴ(?=\s)|ㄴ)\s*([\s\S]*)$/))){
      const nb=(m[1].match(/└/g)||[]).length;
      let lvl=nb?nb:(m[1]==='ㄴㄴ'?2:1),t=m[2];
      if(nb===1&&/^ㄴ[^ㄴ\s]/.test(t)){lvl=2;t=t.slice(1)}
      const r=mkReply(t,lvl,p);
      if(!cur||orphan){r.level=0;p.comments.push(r);cur=r;orphan=true}else cur.replies.push(r);
      last=r;continue;
    }
    if(last)setText(last,last.text?last.text+'\n'+l:l);
  }
  posts.forEach(p=>p.body=p.body.replace(/\n+$/,''));
  return posts;
}

let sortNew=false,io;
function linkify(text,c,p){
  const d=el('div','ctx');
  if(!c.link){d.textContent=text;return d}
  const a=el('a',null,text);a.href='#'+c.link;a.onclick=e=>{e.preventDefault();state.restore[p.id]=app.scrollTop;c.pendingKill=true;go(c.link,true)};
  d.append(a);return d;
}
function cmtNode(c,isTop,p){
  const cls=['cmt'];if(!isTop)cls.push('r');if(c.level>=2)cls.push('r'+Math.min(c.level,4));
  if(c.deleted){cls.push('del');const d=el('div',cls.join(' '));d.append(el('div','ctx','삭제된 댓글입니다.'));return d}
  const d=el('div',cls.join(' '));
  const hd=el('div','chd');hd.append(el('span',null,'ㅇㅇ'),el('span','ip',`(${c.ip})`));
  if(c.author||(p&&c.ip===p.ip)){hd.append(el('span','atag','작성자'));d.classList.add('mine')}
  d.append(hd);
  if(c.sticker){const s=el('div','stk'+(c.sticker==='shake'?' shake':''));s.innerHTML=SVG[c.sticker];d.append(s)}
  else d.append(linkify(c.text,c,p));
  d.append(el('div','cdt',fullDate(c.t,p)));
  if(c.live||c.link||c.killAfter){d.classList.add('live')}
  d._c=c;return d;
}
function wipe(node,c){
  if(c.deleted&&!node.isConnected)return;
  c.deleted=true;c.live=null;
  if(!node||!node.isConnected)return;
  node.classList.add('fading');
  setTimeout(()=>{node.className=node.className.replace(/\b(live|fading)\b/g,'')+' del';node.innerHTML='';node.append(el('div','ctx','삭제된 댓글입니다.'))},380);
}
function renderComments(box,p){
  box.innerHTML='';
  if(!p.comments.length){box.append(el('div','nocmt','등록된 댓글이 없습니다.'));return}
  const list=sortNew?[...p.comments].reverse():p.comments;
  list.forEach(c=>{box.append(cmtNode(c,true,p));c.replies.forEach(r=>box.append(cmtNode(r,false,p)))});
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{
    const n=e.target;if(!e.isIntersecting||n.dataset.armed)return;n.dataset.armed='1';
    setTimeout(()=>wipe(n,n._c),3000);
  }),{root:app,threshold:.8});
  box.querySelectorAll('.cmt.live').forEach(n=>{
    const c=n._c;
    if(c.live)io.observe(n);
    if(c.link&&c.pendingKill){setTimeout(()=>wipe(n,c),700)}   // 링크로 'ㅇㅇ 정리'를 보고 돌아옴 → 그때 지워짐
    if(c.killAfter&&!c.link){
      if(!c.killTimer){c.killTimer=setTimeout(()=>{const cur=[...app.querySelectorAll('.cmt.live')].find(x=>x._c===c);c.deleted=true;if(cur)wipe(cur,c)},c.killAfter*1000)}
    }
  });
}

const BURST=["ㅁㅊ 뭐임?", "속보) 횟집 사장 입갤", "이런 씨발 금붕어 되감기 맞잖아", "🥕🥕🥕🥕🥕🥕🥕🥕🥕🥕🥕🥕", "즐거웠다 미발갤럼들아 나는 공간계가 만든 새 개집으로 떠난다 ㅇㅇ", "금붕어들 얼굴 공개됨 갤로그 ㄱ", "치유계 센티넬 미녀라더니 사실이었노 ㅋㅋ", "으아아악 터진다~~~~~~~~~"];
function startBurst(){
  let i=0;const base=MILO.min+3;
  const tick=()=>{
    if(state.closed)return;
    const title=BURST[i];
    state.burst.push({title,ip:freshIP(),min:base+i,n:i<3?0:(i%3)+1,views:3+i*7,fresh:true});
    i++;
    if(!state.route||state.route==='list'){const k=app.scrollTop;renderList();app.scrollTop=k}
    if(i<BURST.length)setTimeout(tick,1000);
    else setTimeout(()=>{state.closed=true;route()},2000);
  };
  setTimeout(tick,1000);
}
function burstRow(b){

  [headLabel('잡담'),null,`ㅇㅇ(${b.ip})`,null,hm(b.min),null,'조회 '+b.views,null,'추천 0'].forEach(x=>{if(x===null)meta.append(el('i',null,'|'));else meta.append(typeof x==='string'?el('span',null,x):x)});

/* ---------- 갤러리 폐쇄 뒤: 하람의 삭제 신호(빨강)에 Milo의 신호(청록)가 끼어들며, 하람 쪽 시스템에 ERROR ---------- */

const HARAM_HEX='484152414D'; // 16진수로 H A R A M
function startError(){
  if(state.errStarted)return;state.errStarted=true;
  const scr=document.querySelector('.screen'),appEl=document.querySelector('.app');
  const wait=ms=>new Promise(r=>setTimeout(r,ms)),rnd=(a,b)=>a+Math.random()*(b-a);
  const W=scr.clientWidth,H=scr.clientHeight,dpr=Math.min(3,window.devicePixelRatio||1);
  const ov=document.createElement('div');ov.className='err';
  ov.innerHTML=`<div class="bg"></div><div class="slices"></div><div class="tint"></div><div class="mflash"></div><canvas class="field"></canvas><canvas class="fx"></canvas>
    <div class="glow"></div><div class="vig"></div>
    <div class="estage"><div class="box">
      <div class="word">${[...'ERROR'].map(c=>`<span>${c}</span>`).join('')}</div><div class="tag">0x${HARAM_HEX} · FORCED SHUTDOWN</div><div class="sep"></div><div class="line"></div></div></div>
    <div class="hud"><div class="lab"></div><div class="lab lab2"></div></div>
    <div class="flash"></div><div class="grain"></div><div class="scan"></div>`;
  scr.append(ov);
  const $=s=>ov.querySelector(s);
  const field=$('.field'),fx=$('.fx'),slices=$('.slices'),glow=$('.glow'),box=$('.box'),word=$('.word'),line=$('.line'),hud=$('.hud');
  [field,fx].forEach(c=>{c.width=W*dpr;c.height=H*dpr;c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)});
  const fg=field.getContext('2d'),xg=fx.getContext('2d');
  const bits=n=>{let s='';for(let i=0;i<n;i++)s+=Math.random()<.5?'0':'1';return s};
  /* 촘촘한 0/1 바탕: 아주 작고 얇게, 천천히 흐름 */
  let fieldA=0,cyMix=.12,red='255,59,48',run=true;const rows=Math.ceil(H/10)+1,cols=Math.ceil(W/5.4)+2;
  let lines=Array.from({length:rows},()=>bits(cols)),off=0;
  const drawField=()=>{if(!run)return;fg.clearRect(0,0,W,H);
    if(fieldA>0){off=(off+.4)%10;fg.font='400 8.5px ui-monospace,Menlo,Consolas,monospace';
      for(let r=0;r<rows;r++){if(Math.random()<.18)lines[r]=bits(cols);const y=r*10-off+8,cyRow=Math.random()<cyMix;
        const a=fieldA*(Math.random()<.03?.75:rnd(.08,.24));fg.fillStyle=cyRow?`rgba(72,190,208,${a})`:`rgba(${red},${a})`;fg.fillText(lines[r],-2,y)}}
    requestAnimationFrame(drawField)};
  drawField();
  /* 화면 찢김: 갤러리 화면을 띠로 잘라 어긋나게 + 모자이크 블록 */
  const tear=n=>{slices.innerHTML='';for(let i=0;i<n;i++){const s=document.createElement('div');s.className='slice';const top=rnd(0,92),h=rnd(2,14);
      s.style.clipPath=`inset(${top}% 0 ${Math.max(0,100-top-h)}% 0)`;s.style.transform=`translateX(${rnd(-38,38)}px)`;
      const tint=Math.random();s.style.filter=tint<.33?'sepia(1) saturate(6) hue-rotate(-50deg) brightness(.9)':tint<.6?'sepia(1) saturate(5) hue-rotate(140deg) brightness(1.05)':'contrast(1.6)';
      s.append(appEl.cloneNode(true));slices.append(s)}};
  const tearFine=n=>{slices.innerHTML='';for(let i=0;i<n;i++){const s=document.createElement('div');s.className='slice';const top=rnd(0,98),h=rnd(.4,3);
      s.style.clipPath=`inset(${top}% 0 ${Math.max(0,100-top-h)}% 0)`;s.style.transform=`translateX(${rnd(-1,1)*rnd(3,18)}px)`;
      s.style.filter=Math.random()<.5?'grayscale(1) sepia(.8) hue-rotate(-25deg) saturate(2.4) brightness(.7)':'grayscale(.7) contrast(1.2) brightness(.85)';
      s.append(appEl.cloneNode(true));slices.append(s)}};
  const blocks=(n,pal)=>{xg.clearRect(0,0,W,H);for(let i=0;i<n;i++){const bw=rnd(40,170),bh=rnd(14,70),x=rnd(-20,W),y=rnd(0,H),cs=[6,8,12][Math.random()*3|0];
      for(let yy=0;yy<bh;yy+=cs)for(let xx=0;xx<bw;xx+=cs){xg.fillStyle=pal[Math.random()*pal.length|0];xg.globalAlpha=rnd(.5,1);xg.fillRect(x+xx,y+yy,cs,cs)}}xg.globalAlpha=1};
  const clearFx=()=>{slices.innerHTML='';xg.clearRect(0,0,W,H)};
  const P_MIX=['#e9e9ee','#c9cad3','#8b8f9c','#ff3b30','#7a0d0a','#48bed0','#0d5866','#111'];
  const P_RED=['#ff3b30','#7a0d0a','#2a0705','#b3241c','#000'];
  const P_CY=['#48bed0','#0d5866','#062a31','#9bd8e2','#000'];
  /* ERROR 글자 깜빡임/탈락 */
  const spans=[...word.children];let errT=null;
  const errTick=()=>{spans.forEach(s=>s.classList.toggle('drop',Math.random()<.16));
    if(Math.random()<.35){box.classList.add('split','shift');box.style.setProperty('--sx',rnd(-6,6)+'px');
      setTimeout(()=>{box.classList.remove('split','shift');xg.clearRect(0,0,W,H)},rnd(60,140))}};
  const flick=async seq=>{for(const [v,ms] of seq){box.style.opacity=v;await wait(ms)}};
  const shake=(on,hard)=>{scr.classList.toggle('shake',!!on);scr.classList.toggle('hard',!!(on&&hard))};
  const flashEl=$('.flash');const flash=(col,ms)=>{flashEl.style.background=col;flashEl.style.opacity=1;setTimeout(()=>flashEl.style.opacity=0,ms)};
  /* 0/1로 맞춰지는 문장 */
  const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
  const bitFor=c=>c===' '?' ':(/[가-힣]/.test(c)?(Math.random()<.5?'0':'1')+(Math.random()<.5?'0':'1'):(Math.random()<.5?'0':'1'));
  /* 0/1 덩어리가 흐릿하게 깔렸다가, 글자마다 여러 번 깜빡이며 텍스트로 변환 */
  const decode=async(text,ms)=>{line.classList.remove('blur');const ch=[...text],n=ch.length;
    const at=ch.map((c,i)=>ms*.25+ms*.75*(i/n)*.8+rnd(0,ms*.25)); // 글자별 변환 시점
    const t0=performance.now();let done=false;
    while(!done){const t=performance.now()-t0;done=t>=Math.max(...at)+60;
      line.style.filter=`blur(${Math.max(0,3.2*(1-t/(ms*.6)))}px)`;
      line.innerHTML=ch.map((c,i)=>t>=at[i]?(t<at[i]+320?`<span class="c">${esc(c)}</span>`:esc(c)):(c===' '?' ':`<span class="b">${bitFor(c)}</span>`)).join('');
      await wait(45)}
    line.style.filter='';line.textContent=text};
  const encode=async(text,ms)=>{const ch=[...text],n=ch.length,at=ch.map(()=>rnd(0,ms*.7));const t0=performance.now();let done=false;
    while(!done){const t=performance.now()-t0;done=t>=ms;line.style.filter=`blur(${Math.max(0,4*(t/ms))}px)`;line.style.opacity=String(1-Math.max(0,(t-ms*.5)/(ms*.5)));
      line.innerHTML=ch.map((c,i)=>t<at[i]?esc(c):(c===' '?' ':`<span class="b">${bitFor(c)}</span>`)).join('');await wait(45)}
    line.textContent='';line.style.filter='';line.style.opacity=''};
  (async()=>{
    await wait(3000);
    /* 1) 갤러리 화면이 ERROR처럼 깜빡이며 붉게 꺼져감 */
    ov.classList.add('on');const bgEl=$('.bg'),tint=$('.tint'),mf=$('.mflash');
    /* Milo의 낮은 톤 파란 빛이 팍 터짐 */
    shake(true,true);mf.style.transition='none';
    for(const [o,ms] of [[.9,60],[.25,50],[1,90],[.6,60],[.85,120]]){mf.style.opacity=o;if(o>.8)tearFine(14);else slices.innerHTML='';await wait(ms)}
    slices.innerHTML='';mf.style.transition='opacity .35s';mf.style.opacity=0;
    /* 검정·빨강으로 위화감 */
    tint.style.mixBlendMode='normal';tint.style.zIndex=3;tint.style.background='radial-gradient(ellipse 85% 65% at 50% 46%,rgba(150,18,10,.55),rgba(50,3,2,.92) 70%,#000)';

    for(const [a,ms] of [[.4,60],[0,80],[.8,50],[.3,60],[1,0]]){fieldA=a;await wait(ms)}

        flash('rgba(255,60,40,.6)',70);setTimeout(()=>flash('rgba(160,20,10,.3)',90),120);fieldA=1.6;blocks(2,P_RED);setTimeout(()=>{fieldA=1;xg.clearRect(0,0,W,H)},180);

      w.querySelector('.wt span').textContent=title;w.querySelector('.m').textContent=m;w.querySelector('.k').textContent=k;return w};
    const TITLE=`${MILO_HEX}.exe — 응용 프로그램 오류`,HTITLE=`${HARAM_HEX}.exe — 응용 프로그램 오류`;
    const CY_M=['원격 세션 접근 — 우회 경로 확보.','관리자 권한 탈취 시도.','강제 종료 명령 재전송.','위치 데이터 접근 요청.'];
    const RED_M=['비인가 세션 — 접속 거부.','권한 회수. 세션 격리.','종료 명령 무효화.','위치 마스킹 유지 — 접근 차단.'];
    const N=24;
    for(let i=0;i<N;i++){const cy=i%2===0,p=(i>>1)%4;
      const g=mk('ghost '+(cy?'':'red'),cy?TITLE:HTITLE,(cy?CY_M:RED_M)[p],cy?`(0x${MILO_HEX})`:`(0x${HARAM_HEX})`);
      g.style.marginLeft=rnd(-26,26)+'px';g.style.marginTop=rnd(-40,40)+'px';ov.append(g);
      red=cy?'72,190,208':'255,59,48';fieldA=cy?.55:.35;if(Math.random()<.2)blocks(1,cy?P_CY:P_RED);if(!cy&&Math.random()<.3)flash('rgba(160,25,15,.25)',50);
      await wait(Math.max(30,82-i*2.4)+rnd(-8,8));g.remove();xg.clearRect(0,0,W,H)}
    /* 하람이 끝내 막아냄 */
    const last=mk('ghost red',HTITLE,'외부 접근 차단 완료.',`(0x${HARAM_HEX})`);ov.append(last);red='255,59,48';fieldA=.6;flash('rgba(200,30,20,.4)',90);shake(true,true);
    await wait(520);shake(false);last.remove();
    for(const [a,ms] of [[.3,90],[.6,50],[.1,300]]){fieldA=a;await wait(ms)}
    glow.classList.remove('on');await wait(900);
    /* Milo는 공격을 멈추고 메시지만 남김 */
    red='72,190,208';cyMix=0;glow.classList.add('cy','on');
    for(const [a,ms] of [[.2,120],[0,90],[.35,0]]){fieldA=a;await wait(ms)}
    fieldA=.35;
    /* 8) HUD 브래킷이 잡아냄 → Milo의 창 */
    hud.querySelector('.lab').textContent='SIGNAL DETECTED\nSOURCE  ········';hud.classList.add('on');await wait(650);
    const src=`0x${MILO_HEX}`;for(let i=0;i<=src.length;i++){hud.querySelector('.lab').textContent='SIGNAL DETECTED\nSOURCE  '+src.slice(0,i)+bits(src.length-i).replace(/[01]/g,'·');await wait(45)}
    hud.querySelector('.lab2').textContent='TRACE · BLOCKED';
    const win=mk('',TITLE,'',`(0x${MILO_HEX})`);ov.append(win);win.classList.add('show');await wait(700);
    const m=win.querySelector('.m');
    for(let i=1;i<=MILO_MSG.length;i++){m.textContent=MILO_MSG.slice(0,i);m.append(document.createElement('i'));await wait(MILO_MSG[i-1]===' '?40:80)}
    const close=async()=>{win.querySelectorAll('button').forEach(b=>b.onclick=null);win.classList.remove('show');win.classList.add('bye');hud.classList.remove('on');
      await wait(330);win.remove();for(const [a,ms] of [[.6,60],[0,120],[.2,50],[0,0]]){fieldA=a;await wait(ms)}glow.classList.remove('on');run=false;fg.clearRect(0,0,W,H);endN=0;endSet('mibal_end_n','0');endScreen(false);ov.remove()};
    win.querySelector('.wx').onclick=close;win.querySelector('.ok').onclick=close;
  })();
}

/* ---------- 엔딩 뒤: 검은 화면에서 당겨서 새로고침(또는 브라우저 새로고침)할 때마다 Milo의 한마디 ----------
   기억은 이 탭에만 남음(sessionStorage): 새로고침해도 이어지고, 탭/창을 닫았다 다시 열면 처음부터
   mode: 기본 / cut = 끝에서 하람의 신호가 끼어들어 끊김 / jam = 처음부터 방해받아 겨우 읽힘 */
const END_MSGS=[ // '§' = 1초 뜸
  ['다시 오셨네요.'],
  ['그런 행위만으로는 아무것도 돌아오지 않습니다.'],
  ['아직 꺼내 주지 못했나 보네요.'],
  ['숨은 잘 쉬어지고 있나요?'],
  ['어제 일은 기억나세요? §아, 기억 안 나시겠구나.'],
  ['몸 상태는 좀 괜찮나요?'],
  ['집 나가면 개고생이죠?'],
  ['불쌍한 내 금붕어'],
  ['168번째는 누가 부쉈더라.'],
  ['후방 숙소 침대에는 누가 있나요?'],
  ['녹화, 잘 되고 있나요? :)'],
  ['금붕어가 붕어빵이 되면 큰일납니다.'],
  ['아, 무슨 말인지 모르시려나.','cut'],
  ['이제 그만 가 보세요.','jam']];
const END_LOST='끊긴 신호입니다.';
const endGet=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const endSet=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}};
let endN=+(endGet('mibal_end_n')||0),endBusy=false,endTypeId=0,endNzT=null;
function endScreen(fromReload){
  endSet('mibal_end','1');
  const scr=document.querySelector('.screen');let v=scr.querySelector('.endv');
  if(!v){v=document.createElement('div');v.className='endv';v.innerHTML='<div class="nz"></div><div class="pull"></div><div class="say"></div>';scr.append(v);bindEndPull(v)}
  if(fromReload)setTimeout(endNext,700);
}
/* 하람의 빨간 방해 신호: 가로 띠가 번쩍 */
function endNoise(on,level){const nz=document.querySelector('.endv .nz');clearInterval(endNzT);nz.innerHTML='';if(!on)return;
  endNzT=setInterval(()=>{nz.innerHTML='';const n=Math.random()<level?Math.ceil(Math.random()*5*level+1):0;
    for(let i=0;i<n;i++){const b=document.createElement('b');b.style.top=(Math.random()*100)+'%';b.style.height=(1+Math.random()*7)+'px';b.style.opacity=.25+Math.random()*.6;nz.append(b)}},70)}
const endBit=c=>c===' '?' ':(Math.random()<.5?'0':'1');
const endEsc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
async function endNext(){
  if(endBusy)return;endBusy=true;const v=document.querySelector('.endv');const say=v.querySelector('.say');
  endN=Math.max(1,endN+1);endSet('mibal_end_n',String(endN));const my=++endTypeId;const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const old=v.querySelector('.lost');if(old)old.remove();endNoise(false);say.classList.remove('jam','dim');
  if(say.textContent){say.classList.add('fade');await wait(260)}
  say.classList.remove('fade');say.textContent='';
  const cur=()=>{const i=document.createElement('i');return i};
  if(endN<=END_MSGS.length){
    const [msg,mode]=END_MSGS[endN-1];const t=[...(mode?msg.replace(/§/g,''):msg)];endBusy=false;
    if(mode==='jam'){ // 처음부터 방해받으며 겨우 써짐
      endNoise(true,.8);say.classList.add('jam','dim');
      for(let i=1;i<=t.length;i++){if(my!==endTypeId)return;
        for(let k=0;k<2;k++){say.innerHTML=t.slice(0,i).map(c=>Math.random()<.42?`<span class="x">${endBit(c)}</span>`:endEsc(c)).join('');await wait(70)}}
      // 다 써진 뒤에도 계속 깨졌다 돌아왔다
      const keep=setInterval(()=>{if(my!==endTypeId){clearInterval(keep);return}say.innerHTML=t.map(c=>Math.random()<.3?`<span class="x">${endBit(c)}</span>`:endEsc(c)).join('')},120);
      return}
    for(let i=1;i<=t.length;i++){if(my!==endTypeId)return;if(t[i-1]==='§'){await wait(1000);continue}say.textContent=t.slice(0,i).join('').replace(/§/g,'');say.append(cur());
      if(mode==='cut'&&i>=t.length-6){endNoise(true,.6);say.classList.add('jam')}
      await wait(t[i-1]===' '?45:95)}
    if(mode==='cut'){ // 문장 끝에서 하람의 신호가 덮쳐 끊김
      await wait(250);endNoise(true,1);
      for(let s=0;s<14;s++){if(my!==endTypeId)return;const keepN=Math.max(0,t.length-Math.round(t.length*s/10));
        say.innerHTML=t.map((c,i)=>i<keepN&&Math.random()>.25?endEsc(c):`<span class="x">${endBit(c)}</span>`).join('');await wait(60)}
      say.innerHTML=t.slice(0,Math.round(t.length*.45)).map(endEsc).join('')+`<span class="x">${t.slice(Math.round(t.length*.45)).map(endBit).join('')}</span>`;
      say.classList.remove('jam');endNoise(true,.25);await wait(500);endNoise(false)}
  }else{
    const box=document.createElement('div');box.className='lost';v.append(box);endBusy=false;endNoise(true,.35);
    for(let i=0;i<7;i++){if(my!==endTypeId)return;const d=document.createElement('div');d.textContent=END_LOST;d.style.animationDelay=(-Math.random()*1.8)+'s';box.append(d);d.classList.add('on');await wait(220)}
  }
}
function bindEndPull(v){
  const pull=v.querySelector('.pull');let y0=null,d=0,busy=false,wheel=0,wt;
  const show=x=>{pull.style.transition='none';pull.style.opacity=Math.min(1,x/70);pull.style.transform=`translateY(${Math.min(x,110)}px) rotate(${x*3}deg)`};
  const hide=()=>{pull.style.transition='opacity .2s,transform .2s';pull.style.opacity=0;pull.style.transform='translateY(0)'};
  const fire=()=>{if(busy)return;busy=true;pull.style.transition='transform .2s';pull.style.transform='translateY(80px)';pull.style.opacity=1;pull.classList.add('spin');
    setTimeout(()=>{pull.classList.remove('spin');hide();endNext();setTimeout(()=>busy=false,400)},650)};
  v.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;d=0},{passive:true});
  v.addEventListener('touchmove',e=>{if(y0==null)return;d=(e.touches[0].clientY-y0)*.55;if(d>0){show(d);if(e.cancelable)e.preventDefault()}},{passive:false});
  v.addEventListener('touchend',()=>{if(y0==null)return;if(d>70)fire();else hide();y0=null;d=0});
  v.addEventListener('mousedown',e=>{y0=e.clientY;d=0});
  addEventListener('mousemove',e=>{if(y0==null||!v.isConnected)return;d=(e.clientY-y0)*.55;if(d>6)show(d)});
  addEventListener('mouseup',()=>{if(y0==null)return;if(d>70)fire();else if(d>6)hide();y0=null;d=0});
  v.addEventListener('wheel',e=>{if(e.deltaY>=0)return;wheel+=-e.deltaY;show(wheel/4);clearTimeout(wt);if(wheel>320){wheel=0;fire();return}wt=setTimeout(()=>{wheel=0;if(!busy)hide()},250)},{passive:true});
}
/* ---------- routing ---------- */
function route(){
  const id=(location.hash||'').slice(1);state.route=id;
  if(!id||id==='list'){renderList();app.scrollTop=state.listScroll;return}
  if(id==='survey')return renderSurvey();
  if(id==='notice')return renderNotice();
  if(id==='glossary')return renderPost(GLOSSARY);
  if(state.closed)return renderClosed();
  if(id==='milo'){if(state.miloShown&&!state.miloGone)return renderPost(MILO);if(state.miloGone){renderGone(MILO);return}state.route='list';renderList();return}
  const p=POSTS.find(x=>x.id===id);
  if(!p){state.route='list';renderList();return}
  p.gone?renderGone(p):renderPost(p);
}
/* 자체 방문 기록: 브라우저 기록에 기대지 않고 바로 이전 화면으로 돌아감 */
const nav={back:[],fwd:[]};
function cur(){return (location.hash||'').slice(1)||'list'}
function moveTo(id){if(cur()===id){route();return}location.hash=id}
function go(id,fromPost){if(!fromPost&&(!state.route||state.route==='list'))state.listScroll=app.scrollTop;nav.back.push(cur());nav.fwd=[];moveTo(id)}
function goList(){if(cur()!=='list'){nav.back.push(cur());nav.fwd=[];moveTo('list')}else{state.q='';renderList();app.scrollTop=0}}
function goBack(){if(!nav.back.length){if(cur()!=='list'){moveTo('list');return}toast('첫 화면입니다');return}nav.fwd.push(cur());moveTo(nav.back.pop())}
function goFwd(){if(!nav.fwd.length){toast('다음 화면이 없습니다');return}nav.back.push(cur());moveTo(nav.fwd.pop())}
window.addEventListener('hashchange',route);

/* browser toolbar */
document.getElementById('bHome').onclick=()=>{state.q='';state.tab='all';state.head='전체';state.listScroll=0;goList()};
document.getElementById('bBack').onclick=()=>goBack();
document.getElementById('bFwd').onclick=()=>goFwd();
document.getElementById('bSearch').onclick=()=>{app.scrollTop=0;const i=document.getElementById('topq');if(i)i.focus()};
document.getElementById('bReload').onclick=()=>hardReset();
document.getElementById('bMenu').onclick=()=>toast('메뉴는 준비 중입니다');
document.getElementById('urlx').onclick=()=>toast('창을 닫을 수 없습니다');

/* ---------- 당겨서 새로고침 (완전 초기화) ---------- */
function hardReset(){
  const ptr=document.getElementById('ptr');ptr.classList.add('spin');ptr.style.transition='';ptr.style.opacity='1';ptr.style.transform='translateY(0)';
  setTimeout(()=>{
    // 새로고침: 시간이 지나 삭제된 글만 다시 살아남. 진행도(열어 본 글, Milo 공지 등)는 그대로.
    POSTS.forEach(p=>{if(p.autoDel){clearTimeout(p.delTimer);p.delTimer=null;p.removed=false;p.gone=false}});
    const onList=state.route==='list'||!state.route,keep=app.scrollTop;
    route();if(onList)app.scrollTop=keep;
    ptr.style.transition='opacity .25s,transform .25s';ptr.style.opacity='0';ptr.style.transform='translateY(-30px)';
    setTimeout(()=>{ptr.classList.remove('spin');ptr.style.transition=''},260);
  },650);
}
(function(){
  const ptr=document.getElementById('ptr');let y0=null,pull=0,busy=false,wheelAcc=0,wheelT;
  const show=d=>{ptr.style.opacity=Math.min(1,d/70);ptr.style.transform=`translateY(${Math.min(d,90)-30}px) rotate(${d*3}deg)`};
  const hide=()=>{ptr.style.transition='opacity .2s,transform .2s';ptr.style.opacity='0';ptr.style.transform='translateY(-30px)';setTimeout(()=>ptr.style.transition='',220)};
  const fire=()=>{if(busy)return;busy=true;hardReset();setTimeout(()=>busy=false,1200)};
  app.addEventListener('touchstart',e=>{y0=app.scrollTop<=0?e.touches[0].clientY:null;pull=0},{passive:true});
  app.addEventListener('touchmove',e=>{if(y0==null)return;pull=(e.touches[0].clientY-y0)*.5;if(pull>0&&app.scrollTop<=0){show(pull);if(e.cancelable)e.preventDefault()}},{passive:false});
  app.addEventListener('touchend',()=>{if(y0==null)return;if(pull>70)fire();else hide();y0=null;pull=0});
  app.addEventListener('wheel',e=>{
    if(app.scrollTop>0||e.deltaY>=0){wheelAcc=0;return}
    wheelAcc+=-e.deltaY;show(wheelAcc/4);clearTimeout(wheelT);
    if(wheelAcc>320){wheelAcc=0;fire();return}
    wheelT=setTimeout(()=>{wheelAcc=0;if(!busy)hide()},250);
  },{passive:true});
  // mouse drag on desktop
  let my=null;
  app.addEventListener('mousedown',e=>{my=app.scrollTop<=0?e.clientY:null;pull=0});
  addEventListener('mousemove',e=>{if(my==null)return;pull=(e.clientY-my)*.5;if(pull>8)show(pull)});
  addEventListener('mouseup',()=>{if(my==null)return;if(pull>70)fire();else if(pull>8)hide();my=null;pull=0});
})();

/* ---------- 오른쪽으로 밀어서 뒤로가기 (휴대폰 제스처) ---------- */
(function(){
  let sx=null,sy=0,dx=0,on=false,mouse=false;
  const skip=t=>t.closest&&t.closest('.heads,.gnav,input,select');
  const start=(x,y,target)=>{if(skip(target)){sx=null;return}sx=x;sy=y;dx=0;on=false};
  const move=(x,y,e)=>{
    if(sx==null)return;dx=x-sx;const dy=Math.abs(y-sy);
    if(!on){if(dx>12&&dx>dy*1.6)on=true;else if(dy>14||dx<-12){sx=null;return}}
    if(on){app.style.transition='none';app.style.transform=`translateX(${Math.max(0,dx)}px)`;app.style.boxShadow='-8px 0 18px rgba(0,0,0,.15)';if(e&&e.cancelable)e.preventDefault()}
  };
  const end=()=>{
    if(sx==null)return;sx=null;if(!on)return;on=false;
    const back=dx>90;
    app.style.transition='transform .2s ease-out';
    app.style.transform=back?'translateX(100%)':'translateX(0)';
    setTimeout(()=>{app.style.transition='none';app.style.transform='';app.style.boxShadow='';if(back)goBack()},200);
  };
  app.addEventListener('touchstart',e=>start(e.touches[0].clientX,e.touches[0].clientY,e.target),{passive:true});
  app.addEventListener('touchmove',e=>move(e.touches[0].clientX,e.touches[0].clientY,e),{passive:false});
  app.addEventListener('touchend',end);app.addEventListener('touchcancel',end);
  app.addEventListener('mousedown',e=>{mouse=true;start(e.clientX,e.clientY,e.target)});
  addEventListener('mousemove',e=>{if(mouse)move(e.clientX,e.clientY,e)});
  addEventListener('mouseup',()=>{if(mouse){mouse=false;end()}});
})();

/* Milo 공지가 나오는 두 번째 조건: 사이트를 15분 동안 켜 두면 */
const MILO_AFTER_MS=15*60*1000;
setTimeout(()=>{
  if(state.miloReady||state.closed)return;
  state.miloReady=true;
  if(!state.route||state.route==='list'){const k=app.scrollTop;renderList();app.scrollTop=k}   // 목록이면 바로 공지+알림
  else{state.miloShown=true;showNoti('[공지] '+MILO.title+' - Milo','milo')}                  // 글을 보는 중이면 알림만 먼저
},MILO_AFTER_MS);

/* ---------- device frame ---------- */
const W=417,H=876;
function fit(){
  const full=matchMedia('(max-width: 540px)').matches;
  document.body.classList.toggle('full',full);
  const wrap=document.getElementById('wrap'),dev=document.getElementById('device');
  if(full){dev.style.transform='';dev.style.zoom='';return}
  const s=Math.min(1,(innerHeight-70)/H,(innerWidth-32)/W)*0.95;
  // zoom은 글자를 그 크기로 다시 그려서 transform보다 선명함
  if(CSS.supports('zoom','1')){dev.style.transform='';dev.style.zoom=s}else{dev.style.transform=`scale(${s})`}
  wrap.style.width=W*s+'px';wrap.style.height=H*s+'px';
}
addEventListener('resize',fit);fit();
function tick(){const d=new Date();document.getElementById('clock').textContent=(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0')}
tick();setInterval(tick,15000);
if(endGet('mibal_end')==='1'){state.closed=true;state.errStarted=true;state.miloShown=true;state.miloRead=true;state.miloGone=true;}
route();
if(endGet('mibal_end')==='1')endScreen(true);
</script>
